<style>
:root{--navy:#183746;--ink:#20313a;--muted:#607078;--canvas:#eef7f8;--accent:#a9663d;--line:#c8d0d3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--canvas);color:var(--ink)}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
header{height:68px;flex:0 0 68px;background:var(--navy);color:white;display:flex;align-items:center;padding:0 28px;box-shadow:0 2px 8px #1530392e}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.075em}.mark{width:34px;height:34px;border:2px solid #ffffffdd;border-radius:8px;display:grid;place-items:center}.brandtag{margin-left:14px;padding-left:14px;border-left:1px solid rgba(255,255,255,.3);font-size:14px;font-style:italic;letter-spacing:0;font-weight:400;opacity:.82}.shellnav{margin-left:auto;display:flex;gap:24px;font-size:14px}.shellnav a{color:white;text-decoration:none;opacity:.8}.shellnav .active{opacity:1;font-weight:800}
.wrap{max-width:1120px;width:100%;margin:auto;padding:10px 24px 8px;flex:1;min-height:0;display:flex;flex-direction:column}.top{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:6px;flex:0 0 auto}
.eyebrow{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.12em}h1{font-size:24px;margin:4px 0 0}.progress{font-size:14px;color:var(--muted);font-weight:700}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}.cardpane{display:none;text-align:center;width:100%;height:100%;min-height:0}.cardpane.active{display:flex;flex-direction:column;justify-content:center;align-items:center}
.card{display:block;margin:0 auto;max-height:calc(100% - 50px);max-width:min(700px,92vw);width:auto;height:auto;box-shadow:0 8px 28px rgba(24,55,70,.18)}
.choices{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:7px}.choice,.commit{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:8px 16px;font-weight:800;cursor:pointer;margin-top:7px}
.choice.selected,.commit.selected{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.nav{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:6px;flex:0 0 auto}.nav button{border-radius:9px;padding:9px 18px;font-weight:800;cursor:pointer}
#back{background:white;color:var(--ink);border:1px solid var(--line)}#next{background:var(--navy);color:white;border:0}#next:disabled{opacity:.35;cursor:not-allowed}
.print{color:var(--navy);font-weight:700;font-size:14px;text-decoration:none}footer{height:50px;flex:0 0 50px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100% - 1120px)/2));font-size:13px}footer .tag{font-style:italic;font-size:15px}footer .site{font-style:normal}
@media(max-width:900px){.brandtag{display:none}}@media(max-width:650px){header{padding:0 16px}.shellnav{display:none}.wrap{padding:8px 10px 6px}.top{align-items:start}h1{font-size:20px}.card{max-height:calc(100% - 54px);max-width:96vw}}

/* Compact activity identity: keep the activity itself visually primary */
.top{margin-bottom:3px!important;align-items:center!important}
.eyebrow{font-size:10px!important;letter-spacing:.11em!important}
.top h1{font-size:18px!important;margin:2px 0 0!important;line-height:1.1!important}
.progress{font-size:12px!important}

</style>
<style>
/* Activity-page viewport lock: compact one-line identity; card remains fully visible */
@media (min-width:900px){
  .wrap{padding-top:8px!important;padding-bottom:8px!important}
  .top{margin-bottom:6px!important;min-height:34px!important}
  .top h1{font-size:22px!important;line-height:1!important;margin:1px 0!important;white-space:nowrap!important}
  .top .eyebrow{font-size:10px!important;line-height:1!important;margin-bottom:2px!important}
  .top .progress{font-size:13px!important}
  .stage{min-height:0!important}
}
</style>

<script>
let current=0;const panes=[...document.querySelectorAll('.cardpane')];const committed=new Set();
function requiresCommit(i){return [0,2,3,5,6,8,9].includes(i)}
function update(){panes.forEach((p,i)=>p.classList.toggle('active',i===current));document.getElementById('progress').textContent=`Card ${current+1} of ${panes.length}`;document.getElementById('back').disabled=current===0;const n=document.getElementById('next');n.disabled=requiresCommit(current)&&!committed.has(current);n.textContent=current===panes.length-1?'Start over':'Reveal →';window.scrollTo({top:0,behavior:'smooth'})}
function choose(btn){const i=+btn.dataset.card;panes[i].querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');committed.add(i);update()}
function commit(i,btn){btn.classList.add('selected');btn.textContent='Committed';committed.add(i);update()}
function move(d){if(d>0&&current===panes.length-1){current=0;committed.clear();document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));document.querySelectorAll('.commit').forEach(b=>b.textContent=b.dataset.label)}else current=Math.max(0,Math.min(panes.length-1,current+d));update()}
update();
